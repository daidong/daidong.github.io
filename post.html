<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Redirecting — Blog — Dong Dai</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <script>
    // Posts used to be rendered here from ?slug=<slug>. They are now
    // pre-rendered at /blog/<slug>/ so that crawlers can read them.
    // This page only forwards the links that are already out in the world.
    var slug = new URLSearchParams(location.search).get('slug');
    var target = slug ? '/blog/' + encodeURIComponent(slug) + '/' + location.hash : '/blog.html';
    location.replace(target);
  </script>
</head>
<body>
  <p>This post moved. <a href="/blog.html">All posts</a></p>
</body>
</html>
