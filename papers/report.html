<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,follow">
  <title>Redirecting — Paper Reports — Dong Dai</title>
  <link rel="icon" type="image/x-icon" href="/images/favicon/favicon.ico">
  <script>
    // Reports used to be rendered here from ?id=<slug>. They are now
    // pre-rendered at /papers/<slug>/ so that crawlers can read them.
    // This page only forwards the links that are already out in the world.
    var id = new URLSearchParams(location.search).get('id');
    var target = id ? '/papers/' + encodeURIComponent(id) + '/' + location.hash : '/papers/';
    location.replace(target);
  </script>
</head>
<body>
  <p>This report moved. <a href="/papers/">All paper reports</a></p>
</body>
</html>
